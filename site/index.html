    头部 88 ｜ KPI 行 96–184（5 卡 228+228+434×3 gap24×4 = 1856：
    时间进度+今日数据 平分左栏 480 上方，累计初诊/网电/市场 三卡等宽占满其余）

       32+480+48+800+48+480+32 = 1920，中央列 560→1360，中心 = 960
    底部折线 840–1048 通栏 1856 ｜ 底边距 32

  三、亮度控制
    大面积底色走深红渐变（水球三色 ×0.78 → L*≈18~27），
    6 段弧统一降饱和到 L*≤70，禁止荧光色与大面积高饱和红。

  四、调试
    ?static=1 跳过入场动画直接呈现终态（截图核对用）
    ?hover=N  模拟悬停第 N 段弧（tooltip 核对用）
    ?beat=N   直接呈现第 N 次心跳后的数据态（建议与 static=1 同用）
    ?hbms=ms  心跳间隔覆盖（默认 300000 = 5 分钟，调试用短间隔）

  五、数据心跳（见 ⑫ 节）
    每 5 分钟 buildData(beat++) 全量重建数据模型并原地刷新：
    KPI / 渠道 chip / 中央水球（弧段+水位+主数字）/ 左右四面板 /
    底部折线，页面不重载。历史日序列固定，增长落在「今天」的
    数据点上；左下角有心跳指示器（倒计时 + 刷新闪烁）。
  ============================================================-->
